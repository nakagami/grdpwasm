<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grdpwasm — Web RDP Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      background: #16213e;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    #toolbar label { font-size: 12px; color: #aaa; }
    #toolbar input {
      background: #0f3460;
      border: 1px solid #444;
      color: #eee;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    #toolbar input[type=number] { width: 70px; }
    #toolbar input[type=text], #toolbar input[type=password] { width: 130px; }
    #connectBtn {
      background: #e94560;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    #connectBtn:hover { background: #c73652; }
    #connectBtn.connected { background: #2ecc71; }
    #connectBtn.connected:hover { background: #27ae60; }
    #status { font-size: 12px; color: #aaa; margin-left: 8px; }

    #canvasWrapper {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
    }
    #rdpCanvas {
      display: block;
      cursor: none;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>Host</label>
    <input type="text" id="host" value="localhost" placeholder="RDP host" />
    <label>Port</label>
    <input type="number" id="port" value="3389" />
    <label>Domain</label>
    <input type="text" id="domain" value="" placeholder="(optional)" />
    <label>User</label>
    <input type="text" id="user" value="" />
    <label>Password</label>
    <input type="password" id="password" value="" />
    <label>Width</label>
    <input type="number" id="width" value="1280" />
    <label>Height</label>
    <input type="number" id="height" value="800" />
    <button id="connectBtn" onclick="toggleConnect()">Connect</button>
    <span id="status">Loading WASM…</span>
  </div>
  <div id="canvasWrapper">
    <canvas id="rdpCanvas" tabindex="0"></canvas>
  </div>

  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    let connected = false;

    // ── Cookie helpers ────────────────────────────────────────────────────────
    function setCookie(name, value) {
      document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) +
        '; max-age=31536000; SameSite=Strict';
    }
    function getCookie(name) {
      const key = encodeURIComponent(name) + '=';
      for (const part of document.cookie.split(';')) {
        const s = part.trim();
        if (s.startsWith(key)) return decodeURIComponent(s.slice(key.length));
      }
      return null;
    }
    function loadCookies() {
      const fields = ['host', 'port', 'domain', 'width', 'height'];
      for (const id of fields) {
        const v = getCookie('rdp_' + id);
        if (v !== null) document.getElementById(id).value = v;
      }
    }
    function saveCookies() {
      for (const id of ['host', 'port', 'domain', 'width', 'height']) {
        setCookie('rdp_' + id, document.getElementById(id).value.trim());
      }
    }
    loadCookies();

    // ── Web Audio PCM scheduler ───────────────────────────────────────────────
    // AudioContext is created in doConnect() while a user gesture is active,
    // so it starts in 'running' state and avoids browser autoplay suspension.
    // Web Audio automatically resamples AudioBuffers to the context's rate,
    // so we never need to recreate the context when the server changes format.
    let audioCtx = null;
    let audioNextAt = 0;      // next scheduled start time (AudioContext seconds)
    const AUDIO_LOOKAHEAD = 0.15;  // 150 ms look-ahead to absorb WASM jitter
    const AUDIO_MAX_QUEUE = 2.0;   // reset schedule if >2 s ahead (prevents runaway)

    function rdpAudioPlay(sampleRate, channels, bitsPerSample, uint8Data) {
      if (!audioCtx || audioCtx.state === 'closed') return;

      const bytesPerSample = bitsPerSample >> 3;
      const numSamples = uint8Data.byteLength / (channels * bytesPerSample);
      if (numSamples === 0) return;

      // Create AudioBuffer at the server's sample rate.
      // Web Audio resamples automatically to the AudioContext rate.
      const audioBuf = audioCtx.createBuffer(channels, numSamples, sampleRate);

      // Fast native Int16 → Float32 deinterleave using TypedArray view.
      if (bitsPerSample === 16) {
        const int16 = new Int16Array(
          uint8Data.buffer, uint8Data.byteOffset, uint8Data.byteLength >> 1
        );
        for (let ch = 0; ch < channels; ch++) {
          const out = audioBuf.getChannelData(ch);
          for (let i = 0; i < numSamples; i++) {
            out[i] = int16[i * channels + ch] / 32768.0;
          }
        }
      } else if (bitsPerSample === 8) {
        for (let ch = 0; ch < channels; ch++) {
          const out = audioBuf.getChannelData(ch);
          for (let i = 0; i < numSamples; i++) {
            out[i] = (uint8Data[i * channels + ch] - 128) / 128.0;
          }
        }
      }

      const src = audioCtx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (audioNextAt < now + AUDIO_LOOKAHEAD) audioNextAt = now + AUDIO_LOOKAHEAD;
      if (audioNextAt > now + AUDIO_MAX_QUEUE)  audioNextAt = now + AUDIO_LOOKAHEAD;

      src.start(audioNextAt);
      // Use actual audioBuf duration (accounts for resampling rounding).
      audioNextAt += audioBuf.duration;
    }

    // ── WebCodecs H.264 decoder ───────────────────────────────────────────────
    // h264Dec is created fresh on each RDP connection and torn down on
    // disconnect.  Frames are drawn directly onto rdpCanvas via drawImage().
    let h264Dec = null;
    let h264Timestamp = 0; // monotonically increasing μs counter

    // Pending frame position keyed by timestamp (μs).
    const h264FramePos = new Map();

    function h264Supported() {
      return (typeof VideoDecoder !== 'undefined') &&
             (typeof EncodedVideoChunk !== 'undefined');
    }

    function createH264Decoder(width, height) {
      if (!h264Supported()) return null;
      const decoder = new VideoDecoder({
        output(frame) {
          const pos = h264FramePos.get(frame.timestamp);
          h264FramePos.delete(frame.timestamp);
          const x = pos ? pos.x : 0;
          const y = pos ? pos.y : 0;
          ctx2d.drawImage(frame, x, y);
          frame.close();
        },
        error(e) {
          console.warn('WebCodecs H.264 decoder error:', e);
        }
      });
      decoder.configure({
        codec: 'avc1.42E01E',   // H.264 Baseline (covers AVC420/444 from RDP)
        codedWidth: width,
        codedHeight: height,
        optimizeForLatency: true,
      });
      return decoder;
    }

    // Called from Go/WASM with raw H.264 NAL unit data.
    function rdpOnH264(destX, destY, w, h, isKey, uint8Data) {
      if (!h264Dec || h264Dec.state === 'closed') return;
      h264Timestamp += 1000; // 1 ms apart (decoder uses μs)
      h264FramePos.set(h264Timestamp, { x: destX, y: destY });
      try {
        h264Dec.decode(new EncodedVideoChunk({
          type: isKey ? 'key' : 'delta',
          timestamp: h264Timestamp,
          data: uint8Data,
        }));
      } catch (e) {
        console.warn('rdpOnH264 decode error:', e);
      }
    }

    // ── Canvas / ctx2d ────────────────────────────────────────────────────────
    const canvas = document.getElementById('rdpCanvas');
    let ctx2d = canvas.getContext('2d');

    // ── Server-side mouse pointer ─────────────────────────────────────────────
    // The RDP server sends pointer shapes (with hotspots) and cache references.
    // We rasterise each shape to a PNG data URL once and apply it as the
    // canvas's CSS cursor; the browser composites it natively at the local
    // mouse position.  Pointer shapes are cached by server-assigned index;
    // pointer_cached PDUs just re-select an already-rendered shape.
    const pointerCache = new Map(); // idx → CSS cursor value

    function rdpOnPointerHide() {
      canvas.style.cursor = 'none';
    }

    function rdpOnPointerCached(idx) {
      const css = pointerCache.get(idx);
      if (css) canvas.style.cursor = css;
    }

    function rdpOnPointerUpdate(idx, xorBpp, hotX, hotY, w, h, andMask, xorData) {
      const css = buildCursorCss(xorBpp, hotX, hotY, w, h, andMask, xorData);
      if (!css) return;
      pointerCache.set(idx, css);
      canvas.style.cursor = css;
    }

    // buildCursorCss rasterises an MS-RDPBCGR pointer (§2.2.9.1.1.4.4) into a
    // CSS `url(...) hotX hotY, default` cursor value.  AND/XOR mask data
    // arrives top-down (grdp flips it server-side).
    function buildCursorCss(xorBpp, hotX, hotY, w, h, andMask, xorData) {
      if (w <= 0 || h <= 0) return null;
      const off = ('OffscreenCanvas' in window)
        ? new OffscreenCanvas(w, h)
        : Object.assign(document.createElement('canvas'), { width: w, height: h });
      const octx = off.getContext('2d');
      const img = octx.createImageData(w, h);
      const px = img.data;

      // AND mask: 1bpp, padded to 2-byte stride per scanline.
      const andStride = (((w + 15) >> 4) << 1);
      const andBit = (x, y) => {
        const off = y * andStride + (x >> 3);
        if (off >= andMask.length) return 1; // missing → transparent
        return (andMask[off] >> (7 - (x & 7))) & 1;
      };

      if (xorBpp === 1) {
        // Monochrome: XOR mask is 1bpp, same stride rules as AND.
        const xorStride = andStride;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const a = andBit(x, y);
            const xo = xorStride * y + (x >> 3);
            const xb = xo < xorData.length
              ? (xorData[xo] >> (7 - (x & 7))) & 1
              : 0;
            const o = (y * w + x) << 2;
            // (AND, XOR): 00 black, 01 white, 10 transparent, 11 invert→black.
            if (a === 0 && xb === 0)      { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=255; }
            else if (a === 0 && xb === 1) { px[o]=255; px[o+1]=255; px[o+2]=255; px[o+3]=255; }
            else if (a === 1 && xb === 0) { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=0;   }
            else                          { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=255; }
          }
        }
      } else if (xorBpp === 32) {
        // BGRA32, alpha takes precedence over AND mask (modern Windows path).
        const stride = w * 4;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * stride + x * 4;
            const o = (y * w + x) << 2;
            if (s + 3 >= xorData.length) {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
              continue;
            }
            const b = xorData[s], g = xorData[s+1], r = xorData[s+2], a = xorData[s+3];
            if (a !== 0) {
              px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=a;
            } else if (andBit(x, y) === 0) {
              // AND=0 with alpha=0 means opaque-color-but-no-alpha-channel
              // (some servers leave alpha as 0); fall back to AND mask.
              px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=255;
            } else {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
            }
          }
        }
      } else if (xorBpp === 24) {
        // BGR24, AND mask provides transparency. Stride padded to 2 bytes
        // per grdp's flip (matches xorStride = ((w*24 + 15)/16)*2 = w*3 padded).
        const stride = ((w * 3 + 1) >> 1) << 1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * stride + x * 3;
            const o = (y * w + x) << 2;
            if (s + 2 >= xorData.length) {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
              continue;
            }
            if (andBit(x, y) === 0) {
              px[o]=xorData[s+2]; px[o+1]=xorData[s+1]; px[o+2]=xorData[s]; px[o+3]=255;
            } else {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
            }
          }
        }
      } else {
        // Unsupported depth (15/16bpp etc.): leave canvas transparent so the
        // cursor hides rather than rendering garbage.
        console.warn('Unsupported cursor xorBpp:', xorBpp);
      }

      octx.putImageData(img, 0, 0);
      // OffscreenCanvas doesn't expose toDataURL; copy through a regular canvas.
      let dataUrl;
      if (off instanceof HTMLCanvasElement) {
        dataUrl = off.toDataURL('image/png');
      } else {
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        tmp.getContext('2d').drawImage(off, 0, 0);
        dataUrl = tmp.toDataURL('image/png');
      }
      // Clamp hotspot to bitmap bounds — some servers ship out-of-range values.
      const hx = Math.max(0, Math.min(w - 1, hotX|0));
      const hy = Math.max(0, Math.min(h - 1, hotY|0));
      return `url("${dataUrl}") ${hx} ${hy}, default`;
    }

    // ── WASM bootstrap ────────────────────────────────────────────────────────
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(result => {
      go.run(result.instance);
      document.getElementById("status").textContent = "Ready";
    }).catch(e => {
      document.getElementById("status").textContent = "WASM load failed: " + e;
    });

    function proxyURL() {
      return (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    }

    function toggleConnect() {
      if (connected) {
        rdpDisconnect();
        setDisconnected("Disconnected");
      } else {
        doConnect();
      }
    }

    function doConnect() {
      const host     = document.getElementById("host").value.trim();
      const port     = document.getElementById("port").value.trim();
      const domain   = document.getElementById("domain").value.trim();
      const user     = document.getElementById("user").value.trim();
      const password = document.getElementById("password").value;
      const width    = parseInt(document.getElementById("width").value) || 1280;
      const height   = parseInt(document.getElementById("height").value) || 800;

      saveCookies();

      // (Re)create the H.264 decoder sized for this session.
      if (h264Dec) { try { h264Dec.close(); } catch (_) {} }
      h264Dec = createH264Decoder(width, height);
      h264Timestamp = 0;
      h264FramePos.clear();

      // Reset cursor state for the new session.
      pointerCache.clear();
      canvas.style.cursor = 'default';

      // Create AudioContext here, while we're in a user-gesture handler,
      // so the browser starts it in 'running' state (no autoplay suspension).
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} }
      audioCtx = new AudioContext({ latencyHint: 'playback' });
      audioNextAt = 0;
      if (h264Dec) {
        document.getElementById("status").textContent = "Connecting… (WebCodecs H.264 enabled)";
      } else {
        document.getElementById("status").textContent = "Connecting… (WebCodecs unavailable)";
      }
      rdpConnect(proxyURL(), host, port, domain, user, password, width, height);
    }

    // Callbacks from WASM
    function rdpOnReady() {
      connected = true;
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Disconnect";
      btn.classList.add("connected");
      document.getElementById("status").textContent =
        h264Dec ? "Connected (WebCodecs H.264)" : "Connected";
      document.getElementById("rdpCanvas").focus();
    }

    function rdpOnError(msg) {
      setDisconnected("Error: " + msg);
    }

    function rdpOnClose() {
      setDisconnected("Closed");
    }

    function setDisconnected(msg) {
      connected = false;
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; audioNextAt = 0; }
      if (h264Dec) { try { h264Dec.close(); } catch (_) {} h264Dec = null; }
      h264FramePos.clear();
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Connect";
      btn.classList.remove("connected");
      document.getElementById("status").textContent = msg;
    }

    // Mouse / keyboard events
    canvas.addEventListener("mousemove", e => {
      if (!connected) return;
      const r = canvas.getBoundingClientRect();
      rdpMouseMove(Math.floor(e.clientX - r.left), Math.floor(e.clientY - r.top));
    });

    canvas.addEventListener("mousedown", e => {
      if (!connected) return;
      e.preventDefault();
      canvas.focus();
      const r = canvas.getBoundingClientRect();
      // grdp button: 0=left, 1=middle, 2=right  (JS: 0=left, 1=middle, 2=right)
      rdpMouseDown(e.button, Math.floor(e.clientX - r.left), Math.floor(e.clientY - r.top));
    });

    canvas.addEventListener("mouseup", e => {
      if (!connected) return;
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      rdpMouseUp(e.button, Math.floor(e.clientX - r.left), Math.floor(e.clientY - r.top));
    });

    canvas.addEventListener("wheel", e => {
      if (!connected) return;
      e.preventDefault();
      // Normalize browser deltaY to notch count (1.0 = one physical notch).
      // grdp's MouseWheel(delta) expects notch units and handles WHEEL_DELTA scaling.
      // Browser deltaY is positive when scrolling down; RDP wheel is positive for up.
      let delta;
      if (e.deltaMode === 1) {        // DOM_DELTA_LINE: ~3 lines per notch
        delta = -e.deltaY / 3;
      } else if (e.deltaMode === 2) { // DOM_DELTA_PAGE
        delta = -e.deltaY;
      } else {                        // DOM_DELTA_PIXEL: ~100 px per notch
        delta = -e.deltaY / 100;
      }
      rdpMouseWheel(delta);
    }, { passive: false });

    canvas.addEventListener("contextmenu", e => e.preventDefault());

    canvas.addEventListener("keydown", e => {
      if (!connected) return;
      e.preventDefault();
      rdpKeyDown(e.code);
    });

    canvas.addEventListener("keyup", e => {
      if (!connected) return;
      e.preventDefault();
      rdpKeyUp(e.code);
    });
  </script>
</body>
</html>
